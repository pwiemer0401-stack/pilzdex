<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pilzdex</title>
  <meta name="theme-color" content="#C23B2E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pilzdex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Chakra+Petch:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <a href="#/dex" class="brand" aria-label="Pilzdex Startseite">
        <span class="brand-lens" aria-hidden="true"></span>
        <span class="brand-name">Pilzdex</span>
      </a>
      <div class="topbar-right">
        <span id="demo-badge" class="demo-badge" hidden>Demo</span>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>

    <!-- Die Karte bleibt im DOM, damit sie beim Tab-Wechsel nicht neu lädt -->
    <section id="map-view" hidden>
      <div class="map-toolbar">
        <label class="visually-hidden" for="map-filter">Art filtern</label>
        <select id="map-filter"></select>
        <span id="map-count" class="map-count"></span>
      </div>
      <div id="bigmap"></div>
    </section>

    <nav class="tabbar" aria-label="Hauptnavigation" hidden>
      <a href="#/dex" data-tab="dex">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        <span>Dex</span>
      </a>
      <a href="#/karte" data-tab="karte">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-6.2-6.5-11.2A6.5 6.5 0 0 1 12 3.3a6.5 6.5 0 0 1 6.5 6.5C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.4"/></svg>
        <span>Karte</span>
      </a>
      <a href="#/neu" data-tab="neu" class="tab-add" aria-label="Fund eintragen">
        <span class="tab-add-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span>Fund</span>
      </a>
      <a href="#/funde" data-tab="funde">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 17l-5-5-8 8"/></svg>
        <span>Funde</span>
      </a>
      <a href="#/konto" data-tab="konto">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4"/><path d="M4 20c1.5-4 4.5-5.5 8-5.5s6.5 1.5 8 5.5"/></svg>
        <span>Profil</span>
      </a>
    </nav>
  </div>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="species.js"></script>
  <script src="app.js"></script>
</body>
</html>
